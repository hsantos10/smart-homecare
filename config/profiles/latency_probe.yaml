# Generated by scripts/measure_latency.py --setup. Safe to delete.
# Run the rule engine with this profile while measuring; never for a patient.
profile_id: latency-probe
patient_name: Latency Probe
caregiver_name: Caregiver A
rules:
- id: probe-door
  name: Latency probe (virtual door)
  enabled: true
  category: Safety
  severity: HIGH
  trigger_type: door_opened
  message: Latency probe fired at {{time}}
  entity_id: binary_sensor.dari_latency_probe
  cooldown_minutes: 0
notify:
  enabled: false
  min_severity: HIGH
  services:
  - notify.mobile_app_caregiver_phone
watch:
  heart_rate: sensor.smartwatch_heart_rate
  steps_today: sensor.smartwatch_daily_steps
  battery_level: sensor.smartwatch_battery_level
  battery_state: sensor.smartwatch_battery_state
  on_body: binary_sensor.smartwatch_on_body_sensor
  activity_state: sensor.smartwatch_activity_state
  calories: sensor.smartwatch_daily_calories
  distance: sensor.smartwatch_daily_distance
  phone_activity: sensor.caregiver_phone_detected_activity
  sleep_confidence: sensor.caregiver_phone_sleep_confidence
